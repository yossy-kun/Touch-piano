<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>タッチピアノ</title>
<style>
:root{--bg:#1c2631;--bar:#25313f;--line:#3b4a5c;--btn:#2f3d4d;--ac:#2fb5a8;--ink:#e9eef3;--acL1:#bfece7;--acL2:#7fd1c8;--acD:#17635c;--acInk:#06201d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
html,body{margin:0;touch-action:manipulation;-webkit-text-size-adjust:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font:14px/1.2 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
body{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 10px;background:var(--bar)}
#rng{background:var(--bg);border-bottom:1px solid var(--line)}
.grp{display:flex;align-items:center;gap:4px}
button,select{min-height:38px;min-width:40px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--btn);color:var(--ink);font:inherit;font-size:15px}
button:active{background:#3a4b5e}
button.on{background:var(--ac);border-color:var(--ac);color:var(--acInk);font-weight:600}
select{padding:0 6px}
.val{min-width:4.6em;text-align:center;font-variant-numeric:tabular-nums}
.lbl{color:#9fb0c1;font-size:13px}
input[type=range]{accent-color:var(--ac);height:30px;margin:0}
#pos,#pos2{flex:1;min-width:110px}
#sfp{max-width:46vw}
#rt{display:inline-block;width:9em;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
#rt.two{width:15em}
#wid{width:110px}
#cfg{display:none;gap:8px 18px}
#cfg.open{display:flex}
#cfg label{display:flex;align-items:center;gap:6px}
#cfg input[type=range]{width:110px}
#cfg input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
.sw{width:32px;min-width:32px;height:32px;min-height:32px;padding:0;border-radius:50%;border:3px solid transparent}
.sw.sel{border-color:#fff}
#acc{width:44px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--btn)}
#chord{flex:1 1 9em;min-width:0;align-self:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;visibility:hidden;color:#dfe6ee}
#chord .cn{font-size:20px;font-weight:600}
#chord .cs{font-size:11px;color:#9fb0c1;margin-left:.7em}
#stage{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#roll{flex:1;min-height:60px;position:relative;background:#0d1117;border-bottom:1px solid #2a3340;touch-action:none}
#roll canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#kb,#kb2{flex:1;position:relative;overflow:hidden;touch-action:none;background:#0d1117;min-height:90px}
#kb2{border-bottom:1px solid #2a3340}
#in,#in2{position:absolute;left:0;top:0;bottom:0;width:100%}
.key{position:absolute;top:0}
.w{bottom:0;width:var(--ww);background:linear-gradient(#fff,#e8e8e8);border-right:1px solid #a8a8a8;border-radius:0 0 7px 7px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;color:#666;font-size:clamp(10px,calc(var(--ww) * .28),16px);white-space:nowrap}
.w.on{background:linear-gradient(var(--acL1),var(--acL2))}
.b{height:62%;width:calc(var(--ww) * .6);z-index:2;background:linear-gradient(#3b4450,#0d1117);border-radius:0 0 6px 6px;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.b.on{background:linear-gradient(var(--ac),var(--acD))}
</style>
</head>
<body>
<div class="row" id="bar">
  <select id="inst" aria-label="音色"></select>
  <select id="sfp" aria-label="SFプリセット" hidden></select><span class="lbl" id="sfs"></span>
  <div class="grp"><button id="octD" aria-label="表示を1オクターブ下げる">−</button><span class="val" id="octL"></span><button id="octU" aria-label="表示を1オクターブ上げる">＋</button></div>
  <button id="sus" aria-pressed="false">サステイン</button>
  <button id="cfgB">設定</button>
  <span id="chord"><span class="cn"></span><span class="cs"></span></span>
</div>
<div class="row" id="cfg">
  <label>音量<input type="range" id="vol" min="0" max="1" step="0.01"></label>
  <label>残響<input type="range" id="rev" min="0" max="1" step="0.01"></label>
  <label>鍵盤の表示<select id="lab"><option value="c">Cのみ</option><option value="jp">ドレミ</option><option value="en">CDE</option><option value="off">なし</option></select></label>
  <label>画面<select id="lay"><option value="kb">鍵盤のみ</option><option value="roll">ピアノロール＋鍵盤</option><option value="two">二段鍵盤</option></select></label>
  <label id="rsw">流れる速度<input type="range" id="rv" min="1" max="16" step="0.5"></label>
  <label><input type="checkbox" id="chk">コード表示</label>
  <label>コード表記<select id="chm"><option value="abc">C D E</option><option value="jp">ド レ ミ</option></select></label>
  <label><input type="checkbox" id="vel">タッチ位置で強弱</label>
  <label>押したままスライド<select id="sl"><option value="sc">鍵盤をスクロール</option><option value="gl">連続発音</option><option value="off">何もしない</option></select></label>
  <label><input type="checkbox" id="dbg">発音情報を表示(診断用)</label>
  <div class="grp"><button id="sfb">SF2/SF3/DLSを読み込む</button><button id="sfx" hidden>このSFを解除</button><input type="file" id="sff" multiple hidden></div>
  <div class="grp"><span class="lbl">アクセント色</span><span class="grp" id="sws"></span><input type="color" id="acc" aria-label="アクセント色を自由に設定"></div>
  <button id="stop">音を止める</button>
  <button id="fs">全画面</button>
</div>
<div class="row" id="rng">
  <span class="lbl" id="l2" hidden>上段</span><input type="range" id="pos2" min="0" step="any" hidden>
  <span class="lbl" id="l1">位置</span><input type="range" id="pos" min="0" step="any">
  <span class="lbl">幅</span><input type="range" id="wid" min="5" max="75" step="any">
  <span class="lbl" id="rt"></span>
</div>
<div id="stage">
  <div id="roll"><canvas id="rollc"></canvas></div>
  <div id="kb2" hidden><div id="in2"></div></div>
  <div id="kb"><div id="in"></div></div>
</div>

<script>
const $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const EN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const JP=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
const FIRST=0, LAST=127, BLACK=[1,3,6,8,10];

/* 音色: p=[倍音比,音量] w=波形 a=立上り d=減衰 s=持続 r=余韻 fl=フィルタ[開始,終了] fm=[比,開始,終了] v=音量 */
const INST={
  piano:{n:'ピアノ',w:'sine',p:[[1,1],[2,.55],[3,.3],[4,.18],[5,.1],[6,.05]],a:.004,d:1.3,s:0,r:.28,fl:[9,2.5],v:.9},
  epiano:{n:'エレピ',w:'sine',p:[[1,1],[2,.12]],a:.004,d:1.5,s:0,r:.3,fm:[1,2.4,.3],v:.8},
  organ:{n:'オルガン',w:'sine',p:[[1,1],[2,.8],[3,.55],[4,.4],[6,.25],[8,.15]],a:.012,d:.1,s:1,r:.09,v:.75},
  synth:{n:'シンセ',w:'sawtooth',p:[[1,1],[1.006,1]],a:.01,d:.4,s:.55,r:.25,fl:[7,2.2],v:.45},
  strings:{n:'ストリングス',w:'sawtooth',p:[[1,1],[1.005,1],[.995,1]],a:.35,d:.1,s:1,r:.6,fl:[3.5,3.5],v:.4},
  bell:{n:'ベル',w:'sine',p:[[1,1],[2.76,.5],[5.4,.25],[8.93,.12]],a:.002,d:2.2,s:0,r:1.2,v:.8},
  marimba:{n:'マリンバ',w:'sine',p:[[1,1],[4,.3]],a:.002,d:.35,s:0,r:.15,v:1},
  wsin:{g:1,n:'サイン波',w:'sine',p:[[1,1]],a:.005,d:.1,s:1,r:.08,v:.7},
  wtri:{g:1,n:'三角波',w:'triangle',p:[[1,1]],a:.005,d:.1,s:1,r:.08,v:.7},
  wsq:{g:1,n:'矩形波',w:'square',p:[[1,1]],a:.005,d:.1,s:1,r:.08,v:.3},
  wsaw:{g:1,n:'ノコギリ波',w:'sawtooth',p:[[1,1]],a:.005,d:.1,s:1,r:.08,v:.3},
  wp25:{g:1,n:'パルス波 25%',w:'sine',pw:.25,p:[[1,1]],a:.005,d:.1,s:1,r:.08,v:.3},
  wp125:{g:1,n:'パルス波 12.5%',w:'sine',pw:.125,p:[[1,1]],a:.005,d:.1,s:1,r:.08,v:.3}
};

/* 設定（保存） */
let S={inst:'piano',vis:innerWidth<600?8:14,start:null,vol:.8,rev:.25,lab:'c',vel:true,sl:'sc',ac:'#2fb5a8',ch:true,cm:'abc',rl:true,rv:3,lay:null,start2:null};
try{Object.assign(S,JSON.parse(localStorage.getItem('tpiano2')||'{}'))}catch(e){}
if(!S.lay)S.lay=S.rl===false?'kb':'roll'; /* 以前の設定(ピアノロールのオンオフ)を引き継ぐ */
S.rl=S.lay==='roll';
if(!/^#[0-9a-f]{6}$/i.test(S.ac))S.ac='#2fb5a8';S.ac=S.ac.toLowerCase();
if(String(S.inst).startsWith('sf:'))S.inst='piano';
const save=()=>{try{localStorage.setItem('tpiano2',JSON.stringify(S))}catch(e){}};

/* 鍵盤の生成（下段=boards[0] / 上段=boards[1]。どちらも同じ作りで、表示位置だけ別々に持つ） */
const geo={}, whites=[]; /* geo[midi]=[左端(白鍵単位),幅(白鍵単位)] */
let wc=0;
for(let m=FIRST;m<=LAST;m++){
  if(BLACK.includes(m%12))geo[m]=[wc-.3,.6];
  else{geo[m]=[wc,1];whites.push(m);wc++;}
}
const NW=whites.length;
function mkBoard(el,inner,key){
  const B={el,inner,key,keyEl:{},cnt:{},sid:null}; /* sid: この段をスクロール中の指のID */
  for(let m=FIRST;m<=LAST;m++){
    const d=document.createElement('div'),blk=geo[m][1]<1;
    d.className='key '+(blk?'b':'w');d.dataset.m=m;
    d.style.left=`calc(var(--ww) * ${+geo[m][0].toFixed(2)})`;
    if(!blk)d.appendChild(document.createElement('span'));
    inner.appendChild(d);B.keyEl[m]=d;
  }
  return B;
}
const boards=[mkBoard($('kb'),$('in'),'start'),mkBoard($('kb2'),$('in2'),'start2')];
const nm=m=>EN[m%12]+(Math.floor(m/12)-1);

function labels(){
  boards.forEach(B=>whites.forEach(m=>{
    const pc=m%12,o=Math.floor(m/12)-1;let t='';
    if(S.lab==='c'&&pc===0)t='C'+o;
    else if(S.lab==='jp')t=pc===0?'ド'+o:JP[pc];
    else if(S.lab==='en')t=pc===0?'C'+o:EN[pc];
    B.keyEl[m].firstChild.textContent=t;
  }));
}
function moveBoard(B){
  S[B.key]=clamp(S[B.key],0,NW-S.vis);
  B.inner.style.transform=`translateX(calc(var(--ww) * ${-S[B.key]}))`;
}
function rangeInfo(st){
  const a=whites[Math.floor(st)],b=whites[Math.min(NW-1,Math.ceil(st+S.vis)-1)];
  return {t:nm(a)+'–'+nm(b),o:Math.floor(a/12)-1};
}
function moveView(){
  boards.forEach(moveBoard);
  const two=S.lay==='two',l=rangeInfo(S.start),u=rangeInfo(S.start2);
  $('pos').value=S.start;$('pos2').value=S.start2;
  $('rt').textContent=two?u.t+' / '+l.t:l.t;       /* 二段のときは 上段 / 下段 */
  $('octL').textContent=two?'Oct '+u.o+'/'+l.o:'Oct '+l.o;
  drawRoll();
}
function layout(fromWid){
  S.vis=clamp(S.vis,5,NW);
  if(S.start==null)S.start=S.vis>=12?28:35;
  if(S.start2==null)S.start2=S.start+14; /* 上段は下段より2オクターブ上から */
  boards.forEach(B=>B.el.style.setProperty('--ww',(B.el.clientWidth/S.vis)+'px'));
  $('pos').max=$('pos2').max=NW-S.vis; if(!fromWid)$('wid').value=S.vis;
  moveView();
}
/* 画面の使い方: 鍵盤のみ / ピアノロール＋鍵盤 / 二段鍵盤 */
function applyLay(){
  const two=S.lay==='two';
  S.rl=S.lay==='roll';
  $('roll').hidden=!S.rl;$('kb2').hidden=!two;$('rsw').hidden=!S.rl;
  $('pos2').hidden=$('l2').hidden=!two;
  $('l1').textContent=two?'下段':'位置';
  $('rt').classList.toggle('two',two);
  rnotes=[];ropen={};
  layout();sizeRoll();
}
/* ResizeObserverのコールバック内でレイアウトを変えると「loop completed with undelivered notifications」エラーになるため、
   次のフレームにまとめて処理する */
let rzRaf=0;
const onResize=()=>{if(rzRaf)return;rzRaf=requestAnimationFrame(()=>{rzRaf=0;layout();sizeRoll();});};
boards.forEach(B=>new ResizeObserver(onResize).observe(B.el));

/* 音声 */
let ctx,bus,master,wet;
function impulse(sec){
  const n=ctx.sampleRate*sec|0,b=ctx.createBuffer(2,n,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5);}
  return b;
}
function initAudio(){
  if(ctx){if(ctx.state!=='running')ctx.resume();return;}
  ctx=new(window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor(), conv=ctx.createConvolver();
  bus=ctx.createGain(); master=ctx.createGain(); wet=ctx.createGain();
  conv.buffer=impulse(1.8);
  bus.connect(comp); bus.connect(conv); conv.connect(wet); wet.connect(comp);
  comp.connect(master); master.connect(ctx.destination);
  setVol(); setRev();
  ctx.resume();
}
const setVol=()=>{if(master)master.gain.value=S.vol*S.vol};
const setRev=()=>{if(wet)wet.gain.value=S.rev*.9};

const pwc={};
function pulse(d){
  if(pwc[d])return pwc[d];
  const N=128,re=new Float32Array(N),im=new Float32Array(N);
  for(let n=1;n<N;n++){const k=2/(n*Math.PI),sn=Math.sin(n*Math.PI*d),cs=Math.cos(n*Math.PI*d);re[n]=k*sn*cs;im[n]=k*sn*sn;}
  return pwc[d]=ctx.createPeriodicWave(re,im);
}
const live=new Set();
function voice(m,vel){
  if(S.inst.startsWith('sf:'))return sfVoice(m,vel);
  const I=INST[S.inst], t=ctx.currentTime+.01, f=440*Math.pow(2,(m-69)/12);
  if(f<8||f>16000)return null;
  const dd=I.d*clamp(Math.pow(261.6/f,.35),.4,2);
  const env=ctx.createGain(); env.gain.value=0; env.connect(bus); /* 初期値0（既定値1だと鳴り始めに音が飛ぶ） */
  const at=Math.max(I.a,.008);
  let inp=env;
  if(I.fl){
    const F=ctx.createBiquadFilter();F.type='lowpass';F.Q.value=.5;
    F.frequency.value=Math.min(f*I.fl[0],18000);
    F.frequency.setValueAtTime(Math.min(f*I.fl[0],18000),t);
    F.frequency.setTargetAtTime(Math.min(f*I.fl[1],18000),t,Math.max(.05,dd*.6));
    F.connect(env);inp=F;
  }
  const oscs=[], norm=I.p.reduce((s,p)=>s+p[1],0);
  I.p.forEach(([r,g],i)=>{
    const o=ctx.createOscillator(),G=ctx.createGain();
    if(I.pw)o.setPeriodicWave(pulse(I.pw));else o.type=I.w;o.frequency.value=f*r;G.gain.value=g/norm;
    o.connect(G);G.connect(inp);o.start(t);oscs.push(o);
    if(I.fm&&i===0){
      const mo=ctx.createOscillator(),mg=ctx.createGain();
      mo.frequency.value=f*I.fm[0];
      mg.gain.value=f*I.fm[1];mg.gain.setValueAtTime(f*I.fm[1],t);mg.gain.setTargetAtTime(f*I.fm[2],t,.4);
      mo.connect(mg);mg.connect(o.frequency);mo.start(t);oscs.push(mo);
    }
  });
  const pk=vel*I.v;
  env.gain.setValueAtTime(0,t);
  env.gain.linearRampToValueAtTime(pk,t+at);
  env.gain.setTargetAtTime(pk*I.s,t+at,dd);
  if(I.s===0)oscs.forEach(o=>{try{o.stop(t+at+dd*8)}catch(e){}});
  const V={done:false,release(){
    if(V.done)return;V.done=true;
    const n=ctx.currentTime,g=env.gain,cur=g.value;
    g.cancelScheduledValues(n);g.setValueAtTime(cur,n);g.setTargetAtTime(0,n,I.r/3);
    oscs.forEach(o=>{try{o.stop(n+I.r*1.6+.05)}catch(e){}});
  }};
  oscs[0].onended=()=>{live.delete(V);try{env.disconnect()}catch(e){}};
  live.add(V);
  if(live.size>40){const o=live.values().next().value;o.release();live.delete(o);}
  return V;
}

/* ===== サウンドフォント (SF2 / SF3 / DLS) ===== */
let sf=null,sfs=[],sfPreset=null,sfTok=0,sfExcl={},dbg=false; /* sf: 現在選択中のフォント / sfs: 読み込み済みの全フォント */
const sfStatus=t=>{$('sfs').textContent=t;};
/* ジェネレータ既定値（SF2のgen番号。DLSもこの番号体系に変換して扱う） */
const DEF={0:0,1:0,4:0,12:0,2:0,3:0,5:0,6:0,7:0,8:13500,9:0,10:0,11:0,13:0,17:0,21:-12000,22:0,23:-12000,24:0,25:-12000,26:-12000,27:-12000,28:-12000,29:0,30:-12000,31:0,32:0,33:-12000,34:-12000,35:-12000,36:-12000,37:0,38:-12000,39:0,40:0,45:0,46:-1,48:0,50:0,51:0,52:0,54:0,56:100,57:0,58:-1};
/* 既定モジュレーター: ベロシティ→音量(凹カーブ) / ベロシティ→カットオフ */
const DEFMODS=[{s:0x0502,d:48,a:960,as:0,t:0},{s:0x0102,d:8,a:-2400,as:0,t:0}];

function parseSF(ab){
  const u8=new Uint8Array(ab),dv=new DataView(ab);
  const id=o=>String.fromCharCode(u8[o],u8[o+1],u8[o+2],u8[o+3]);
  const str=(o,n)=>{let t='';for(let i=0;i<n&&u8[o+i];i++)t+=String.fromCharCode(u8[o+i]);return t.trim();};
  const u32=o=>dv.getUint32(o,true),u16=o=>dv.getUint16(o,true);
  if(ab.byteLength<12||id(0)!=='RIFF')throw new Error('SF2/SF3/DLSファイルではありません');
  if(id(8)==='DLS ')return parseDLS(ab);
  if(id(8)!=='sfbk')throw new Error('SF2/SF3/DLSファイルではありません');
  const r={kind:'sf',ab,smpl:0,phdr:[],pbag:[],pbm:[],pmod:[],pgen:[],inst:[],ibag:[],ibm:[],imod:[],igen:[],shdr:[]};
  const gen=q=>{const o=u16(q);return(o===43||o===44)?[o,[u8[q+2],u8[q+3]]]:(o===41||o===53)?[o,u16(q+2)]:[o,dv.getInt16(q+2,true)];};
  const mod=q=>({s:u16(q),d:u16(q+2),a:dv.getInt16(q+4,true),as:u16(q+6),t:u16(q+8)});
  const walk=(o,end,fn)=>{while(o+8<=end){const c=id(o),z=u32(o+4);fn(c,o+8,z);o+=8+z+(z&1);}};
  walk(12,ab.byteLength,(c,o,z)=>{
    if(c!=='LIST')return;
    const type=id(o);
    walk(o+4,o+z,(c2,p,n)=>{
      const rec=(sz,fn)=>{const a=[];for(let i=0;i+sz<=n;i+=sz)a.push(fn(p+i));return a;};
      if(type==='sdta'&&c2==='smpl')r.smpl=p;
      else if(type!=='pdta')return;
      else if(c2==='phdr')r.phdr=rec(38,q=>({name:str(q,20),num:u16(q+20),bank:u16(q+22),bag:u16(q+24)}));
      else if(c2==='pbag'){r.pbag=rec(4,q=>u16(q));r.pbm=rec(4,q=>u16(q+2));}
      else if(c2==='pmod')r.pmod=rec(10,mod);
      else if(c2==='pgen')r.pgen=rec(4,gen);
      else if(c2==='inst')r.inst=rec(22,q=>({name:str(q,20),bag:u16(q+20)}));
      else if(c2==='ibag'){r.ibag=rec(4,q=>u16(q));r.ibm=rec(4,q=>u16(q+2));}

    if(src.loop&&sus<.001)src.stop(t3+dc+.2);
    if(dbg&&!dbgS)dbgS=`${sh.name||'wave'+L.sid} 鍵${m} root${root} fine${Math.round(corr+g[52])} ${B.tsr}Hz 速度×${src.playbackRate.value.toFixed(4)} ${src.loop?'loop '+Math.round(ls)+'-'+Math.round(le)+' (長さ'+Math.round(le-ls)+')':'loopなし'} LFO→音程${Math.round(g[5])} Vib${Math.round(g[6])} EG2→音程${Math.round(g[7])}(sus ${Math.round(g[29])})`;
    parts.push({src,env,rel,mode:src.loop?mode:0,me,mrel:clamp(tc(g[30]),.05,10),aux});
    if(g[57])ex.add(g[57]);
  }
  if(!parts.length)return null;
  if(dbg)sfStatus(dbgS);
  let left=parts.length;
  parts.forEach(p=>{p.src.onended=()=>{p.aux.forEach(a=>{try{a.stop()}catch(x){}});try{p.env.disconnect()}catch(x){}if(--left===0)live.delete(V);};});
  ex.forEach(c=>{if(sfExcl[c]&&sfExcl[c]!==V)sfExcl[c].release();sfExcl[c]=V;});
  live.add(V);
  if(live.size>40){const o=live.values().next().value;o.release();live.delete(o);}
  return V;
}

/* ===== コード表示 ===== */
const PC_ABC=['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const PC_JP=['ド','レ♭','レ','ミ♭','ミ','ファ','ファ♯','ソ','ラ♭','ラ','シ♭','シ'];
const IV_NAME=['同音','短2度','長2度','短3度','長3度','完全4度','増4度/減5度','完全5度','短6度','長6度','短7度','長7度'];
/* [表記, 構成音(ルートからの半音数)] 並び順が優先順位 */
const CHORDS=[
  ['',[0,4,7]],['m',[0,3,7]],['dim',[0,3,6]],['aug',[0,4,8]],['sus4',[0,5,7]],['sus2',[0,2,7]],
  ['6',[0,4,7,9]],['m6',[0,3,7,9]],['7',[0,4,7,10]],['maj7',[0,4,7,11]],['m7',[0,3,7,10]],['mMaj7',[0,3,7,11]],
  ['dim7',[0,3,6,9]],['m7♭5',[0,3,6,10]],['aug7',[0,4,8,10]],['7sus4',[0,5,7,10]],
  ['add9',[0,2,4,7]],['m(add9)',[0,2,3,7]],['6/9',[0,2,4,7,9]],['9',[0,2,4,7,10]],['maj9',[0,2,4,7,11]],['m9',[0,2,3,7,10]]
];
function detectChord(notes){ /* notes: 昇順のMIDIノート番号。当てはまるコードをすべて、優先度順に返す */
  const pcs=[...new Set(notes.map(n=>n%12))],bass=notes[0]%12,out=[];
  for(const r of pcs){
    const iv=new Set(pcs.map(q=>(q-r+12)%12));
    CHORDS.forEach(([suf,tpl],idx)=>{
      const full=tpl.length===iv.size&&tpl.every(x=>iv.has(x));
      let no5=false;
      if(!full&&tpl.length>=4&&tpl.includes(7)){const t2=tpl.filter(x=>x!==7);no5=t2.length===iv.size&&t2.every(x=>iv.has(x));}
      if(!full&&!no5)return;
      out.push({score:(r===bass?100:0)-idx-(no5?15:0),r,bass,suf:suf+(no5?'(no5)':'')});
    });
  }
  return out.sort((a,b)=>b.score-a.score);
}
function updChord(){
  const box=$('chord');
  const notes=S.ch?heldNotes():[];
  if(notes.length<2){box.style.visibility='hidden';return;} /* 離したらすぐ消す */
  const N=S.cm==='jp'?PC_JP:PC_ABC,pcs=[...new Set(notes.map(n=>n%12))];
  const list=notes.map(n=>N[n%12]+(Math.floor(n/12)-1)).join(' ');
  const cs=detectChord(notes);
  let name;
  if(cs.length)name=cs.slice(0,4).map(c=>N[c.r]+c.suf+(c.bass!==c.r?'/'+N[c.bass]:'')).join('  /  ');
  else if(pcs.length===1)name='オクターブ';
  else if(pcs.length===2)name=IV_NAME[(pcs.find(q=>q!==notes[0]%12)-notes[0]%12+12)%12];
  else name=pcs.map(q=>N[q]).join(' ');
  box.firstChild.textContent=name;box.lastChild.textContent=list;
  box.style.visibility='visible'; /* 表示の有無で配置が動かないよう visibility を使う */
}

/* ===== ピアノロール（押した長さのノートが、押した鍵盤の位置から上へ流れる） ===== */
const roll=$('roll'),rc=$('rollc'),rx=rc.getContext('2d');
let rnotes=[],ropen={},rafR=0;
function sizeRoll(){
  const w=roll.clientWidth,h=roll.clientHeight,d=window.devicePixelRatio||1;
  rc._w=w;rc._h=h;
  rc.width=Math.max(1,Math.round(w*d));rc.height=Math.max(1,Math.round(h*d));
  rx.setTransform(d,0,0,d,0,0);
  drawRoll();
}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);rx.beginPath();rx.moveTo(x+r,y);rx.arcTo(x+w,y,x+w,y+h,r);rx.arcTo(x+w,y+h,x,y+h,r);rx.arcTo(x,y+h,x,y,r);rx.arcTo(x,y,x+w,y,r);rx.closePath();}
function drawRoll(){
  const W=rc._w,H=rc._h;
  if(!S.rl||!W||!H)return;
  const ww=W/S.vis,now=performance.now(),sp=H*S.rv/9000; /* 1ミリ秒あたりの移動量(px) */
  rx.clearRect(0,0,W,H);
  /* 背景: 黒鍵の列と白鍵の境界線（鍵盤と位置をそろえる） */
  for(let m=FIRST;m<=LAST;m++){
    const g=geo[m],x=(g[0]-S.start)*ww;
    if(x>W||x+g[1]*ww<0)continue;
    if(g[1]<1){rx.fillStyle='rgba(0,0,0,.28)';rx.fillRect(x,0,g[1]*ww,H);}
    else{rx.fillStyle=m%12===0?'rgba(255,255,255,.16)':'rgba(255,255,255,.06)';rx.fillRect(x,0,1,H);}
  }
  /* ノート: 下端=離した時刻、上端=押した時刻。押している間は下端が鍵盤に接したまま伸びる */
  const cW=mix(S.ac,[255,255,255],.2),cB=S.ac,cH=mix(S.ac,[255,255,255],.55);
  for(const n of rnotes){
    const g=geo[n.m],x=(g[0]-S.start)*ww+1,w=g[1]*ww-2;
    if(x+w<0||x>W)continue;
    const e=n.e==null?now:n.e,yb=H-(now-e)*sp,yt=Math.min(H-(now-n.s)*sp,yb-3);
    rx.fillStyle=n.e==null?cH:(g[1]<1?cB:cW);
    rr(x,yt,w,yb-yt,3);rx.fill();
  }
  rnotes=rnotes.filter(n=>n.e==null||H-(now-n.e)*sp>0); /* 画面の上に出たノートは捨てる */
}
function rollLoop(){
  rafR=0;drawRoll();
  if(!rnotes.length)drawRoll(); /* 最後のノートが消えた後の背景だけの描き直し */
  else if(S.rl)rafR=requestAnimationFrame(rollLoop);
}
function rollNote(m,on){
  if(!S.rl)return;
  const t=performance.now();
  if(on){const n={m,s:t,e:null};rnotes.push(n);(ropen[m]=ropen[m]||[]).push(n);}
  else{const n=ropen[m]&&ropen[m].shift();if(n)n.e=t;}
  if(!rafR)rafR=requestAnimationFrame(rollLoop);
}
new ResizeObserver(onResize).observe(roll);

/* サステイン */
let sus=false;const pend=new Set();
function rel(V){if(!V)return;sus?pend.add(V):V.release();}
function setSus(on){
  sus=on;$('sus').classList.toggle('on',on);$('sus').setAttribute('aria-pressed',on);
  if(!on){pend.forEach(v=>v.release());pend.clear();}
}

/* タッチ・マウス（複数同時押し対応。上段・下段どちらでも同時に弾ける） */
const act=new Map();
function heldNotes(){const h=new Set();boards.forEach(B=>{for(const k in B.cnt)if(B.cnt[k]>0)h.add(+k);});return [...h].sort((a,b)=>a-b);}
function setOn(B,m,on){B.cnt[m]=(B.cnt[m]||0)+(on?1:-1);B.keyEl[m].classList.toggle('on',B.cnt[m]>0);updChord();rollNote(m,on);}
function keyAt(x,y,B){
  const r=B.el.getBoundingClientRect();
  const e=document.elementFromPoint(clamp(x,r.left+1,r.right-1),y),k=e&&e.closest?e.closest('.key'):null;
  return k&&B.el.contains(k)?k:null; /* 触れ始めた鍵盤の外に出たら離したことにする */
}
function press(id,k,x,y,B){
  const m=+k.dataset.m;let vel=.8;
  if(S.vel){const r=k.getBoundingClientRect();vel=.3+.7*clamp((y-r.top)/r.height,0,1);}
  act.set(id,{b:B,m,v:voice(m,vel),x,y,x0:x,y0:y,scr:false});setOn(B,m,true);
}
function release(id){const a=act.get(id);if(!a)return;act.delete(id);if(a.b.sid===id){a.b.sid=null;save();}setOn(a.b,a.m,false);rel(a.v);}
const inRect=(x,y,el)=>{const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;};
function slide(id){
  const a=act.get(id);if(!a)return;
  const k=keyAt(a.x,a.y,a.b);
  if(!k){
    /* 指がもう一方の段に移っても、押し始めた段の音をそのまま継続する */
    if(boards.some(b=>b!==a.b&&!b.el.hidden&&inRect(a.x,a.y,b.el)))return;
    release(id);return;
  }
  if(+k.dataset.m!==a.m){const B=a.b;release(id);press(id,k,a.x,a.y,B);}
}
boards.forEach(B=>{
  const el=B.el;
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();initAudio();
    try{el.setPointerCapture(e.pointerId)}catch(x){}
    const k=keyAt(e.clientX,e.clientY,B);if(k)press(e.pointerId,k,e.clientX,e.clientY,B);
  });
  el.addEventListener('pointermove',e=>{
    const a=act.get(e.pointerId);if(!a)return;
    a.x=e.clientX;a.y=e.clientY;
    if(S.sl==='gl')slide(e.pointerId);
    else if(S.sl==='sc'){
      /* 押した鍵盤が指に吸い付くように、指の横移動量だけ、その段の表示をスクロール */
      const dx=a.x-a.x0,Bd=a.b,K=Bd.key;
      if(!a.scr&&Bd.sid==null&&Math.abs(dx)>24){a.scr=true;Bd.sid=e.pointerId;a.bx=a.x;a.bs=S[K];} /* スクロールは段ごとに1本の指が担当（上下の段は同時に動かせる） */
      if(Bd.sid===e.pointerId){S[K]=a.bs-(a.x-a.bx)/(Bd.el.clientWidth/S.vis);moveView();}
    }
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,e=>release(e.pointerId)));
  el.addEventListener('contextmenu',e=>e.preventDefault());
});
function panic(){[...act.keys()].forEach(release);pend.clear();live.forEach(v=>v.release());setSus(false);}
addEventListener('blur',panic);
document.addEventListener('visibilitychange',()=>{if(document.hidden)panic();});

/* コントロール */
const grp={};
Object.entries(INST).forEach(([k,v])=>{
  const gn=v.g?'波形':'楽器';
  if(!grp[gn]){grp[gn]=document.createElement('optgroup');grp[gn].label=gn;$('inst').appendChild(grp[gn]);}
  const o=document.createElement('option');o.value=k;o.textContent=v.n;grp[gn].appendChild(o);
});
$('inst').value=S.inst;
$('inst').onchange=e=>{S.inst=e.target.value;if(isSf(S.inst))activateFont(+S.inst.slice(3));updSf();save();};
const octMove=d=>{S.start+=d*7;if(S.lay==='two')S.start2+=d*7;save();moveView();}; /* 二段のときは上下とも動かす */
$('octD').onclick=()=>octMove(-1);$('octU').onclick=()=>octMove(1);
$('sus').onclick=()=>{initAudio();setSus(!sus);};
$('cfgB').onclick=()=>{const o=$('cfg').classList.toggle('open');$('cfgB').classList.toggle('on',o);};
$('pos').oninput=e=>{S.start=+e.target.value;moveView();};
$('pos2').oninput=e=>{S.start2=+e.target.value;moveView();};$('pos2').onchange=save;
$('pos').onchange=save;
$('wid').oninput=e=>{const ov=S.vis,nv=+e.target.value;boards.forEach(B=>{S[B.key]+=(ov-nv)/2;});S.vis=nv;layout(true);};
$('wid').onchange=save;
$('vol').value=S.vol;$('vol').oninput=e=>{S.vol=+e.target.value;setVol();save();};
$('rev').value=S.rev;$('rev').oninput=e=>{S.rev=+e.target.value;setRev();save();};
$('lab').value=S.lab;$('lab').onchange=e=>{S.lab=e.target.value;save();labels();};
$('vel').checked=S.vel;$('vel').onchange=e=>{S.vel=e.target.checked;save();};
$('lay').value=S.lay;$('lay').onchange=e=>{S.lay=e.target.value;save();applyLay();};
$('rv').value=S.rv;$('rv').oninput=e=>{S.rv=+e.target.value;drawRoll();};$('rv').onchange=save;
$('chk').checked=S.ch;$('chk').onchange=e=>{S.ch=e.target.checked;save();updChord();};
$('chm').value=S.cm;$('chm').onchange=e=>{S.cm=e.target.value;save();updChord();};
$('sl').value=S.sl;$('sl').onchange=e=>{S.sl=e.target.value;save();};
$('stop').onclick=panic;
if(document.fullscreenEnabled)$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
else $('fs').style.display='none';

/* サウンドフォントUI（複数読み込み対応） */
const isSf=v=>String(v).startsWith('sf:');
function updSf(){const on=isSf(S.inst);$('sfp').hidden=!on;$('sfx').hidden=!on;}
function sfOpt(){
  const old=$('sfg');if(old)old.remove();
  if(!sfs.length)return;
  const g=document.createElement('optgroup');g.id='sfg';g.label='サウンドフォント';
  sfs.forEach((F,k)=>{const o=document.createElement('option');o.value='sf:'+k;o.textContent=(F.kind==='dls'?'DLS: ':'SF: ')+F.name;g.appendChild(o);});
  $('inst').appendChild(g);
}
const fontList=F=>F.phdr.slice(0,-1).map((p,i)=>({i,bank:p.bank,num:p.num,name:p.name})).sort((a,b)=>a.bank-b.bank||a.num-b.num);
function sfFill(F){
  $('sfp').innerHTML='';
  fontList(F).forEach(p=>{const o=document.createElement('option');o.value=p.i;o.textContent=String(p.bank).padStart(3,'0')+':'+String(p.num).padStart(3,'0')+' '+p.name;$('sfp').appendChild(o);});
  $('sfp').value=F.cur;
}
/* 選択したフォントに切り替える（プリセット未読み込みなら読み込む） */
async function activateFont(k){
  const F=sfs[k];if(!F)return;
  sfTok++;sf=F;sfPreset=F.preset||null;sfExcl={};
  sfFill(F);sfStatus('');
  if(!F.preset)await loadPreset(F.cur);
}
$('sfb').onclick=()=>$('sff').click();
$('sff').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';if(!files.length)return;
  initAudio();
  let last=-1;const errs=[];
  for(const f of files){
    sfStatus('解析中… '+f.name);
    try{
      const r=parseSF(await f.arrayBuffer());
      r.name=f.name;r.bufs=new Map();r.preset=null;
      const list=fontList(r),def=list.find(x=>x.bank===0&&x.num===0)||list[0];
      if(!def)throw new Error('プリセットがありません');
      r.cur=def.i;sfs.push(r);last=sfs.length-1;
    }catch(err){errs.push(f.name+': '+(err&&err.message||err));}
  }
  if(last>=0){
    sfOpt();S.inst='sf:'+last;$('inst').value=S.inst;updSf();save();
    await activateFont(last);
  }
  if(errs.length)sfStatus('読み込み失敗 '+errs.join(' / '));
};
$('sfp').onchange=e=>loadPreset(+e.target.value);
$('dbg').onchange=e=>{dbg=e.target.checked;if(!dbg)sfStatus('');};
/* 選択中のフォントだけを解除 */
$('sfx').onclick=()=>{
  const k=sfs.indexOf(sf);if(k<0)return;
  sfTok++;sfs.splice(k,1);sf=null;sfPreset=null;sfExcl={};
  sfOpt();S.inst='piano';$('inst').value='piano';save();updSf();sfStatus('');
};

/* アクセントカラー */
const PRESETS=['#2fb5a8','#4f8cff','#f08a3c','#e8579a','#9b6cf0','#5cc46a','#e5484d','#e8c23a'];
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(h,t,k)=>'#'+rgb(h).map((v,i)=>Math.round(v+(t[i]-v)*k).toString(16).padStart(2,'0')).join('');
function applyAccent(){
  const h=S.ac,rs=document.documentElement.style,[r,g,b]=rgb(h);
  rs.setProperty('--ac',h);
  rs.setProperty('--acL1',mix(h,[255,255,255],.7));
  rs.setProperty('--acL2',mix(h,[255,255,255],.35));
  rs.setProperty('--acD',mix(h,[0,0,0],.5));
  rs.setProperty('--acInk',(.299*r+.587*g+.114*b)>150?'#10181f':'#fff');
  $('acc').value=h;
  document.querySelectorAll('.sw').forEach(e=>e.classList.toggle('sel',e.dataset.c===h));
  drawRoll();
}
PRESETS.forEach(c=>{
  const b=document.createElement('button');
  b.className='sw';b.dataset.c=c;b.style.background=c;b.setAttribute('aria-label','アクセント色 '+c);
  b.onclick=()=>{S.ac=c;save();applyAccent();};
  $('sws').appendChild(b);
});
$('acc').oninput=e=>{S.ac=e.target.value.toLowerCase();save();applyAccent();};
applyAccent();

/* iOS: ダブルタップで出る丸いルーペ（拡大鏡）やページの拡大を出さない。
   入力欄・選択欄・ラベル以外では touchstart の既定動作を止める（鍵盤はpointerイベントで動くので影響しない）。
   ボタンは既定動作を止めるとclickも出なくなるため、指を離した位置がボタン上ならclickを自分で起こす。 */
['selectstart','gesturestart','gesturechange','gestureend','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
let tBtn=null;
document.addEventListener('touchstart',e=>{
  const t=e.target;
  if(t.closest&&t.closest('input,select,label,a')){tBtn=null;return;}
  e.preventDefault();
  tBtn=t.closest?t.closest('button'):null;
},{passive:false});
document.addEventListener('touchend',e=>{
  const b=tBtn;tBtn=null;
  if(!b)return;
  const c=e.changedTouches[0],el=c&&document.elementFromPoint(c.clientX,c.clientY);
  if(el&&b.contains(el))b.click();
},{passive:false});
document.addEventListener('touchcancel',()=>{tBtn=null;});

applyLay();labels();
</script>
